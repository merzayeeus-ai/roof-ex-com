name: Rebuild Field Notes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Require the update branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/field-notes-update" ]; then
            echo "::error::Run this workflow on field-notes-update, not main."
            exit 1
          fi

      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: field-notes-update

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and rebuild Field Notes
        env:
          COMPANYCAM_API_TOKEN: ${{ secrets.COMPANYCAM_API_TOKEN }}
          BUILD_DIR: .
        run: node script/rebuild-field-notes.mjs

      - name: Commit updates to the update branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "Refresh Field Notes"
            git push origin HEAD:field-notes-update
          fi
